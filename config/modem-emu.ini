# Installed as /etc/modem-emu.conf. CLI options override endpoint settings.
[network]
bind = 0.0.0.0
advertise = 0.0.0.0
sip_port = 5072
rtp_port = 4012
# Set the destination ATA or registrar, for example 192.168.196.29:5060.
dial_target =

[modem]
role = auto
law = pcmu
rtp_packet_ms = 30
compression = v42bis

[terminal]
link = /run/modem-emu/tty

[logging]
level = info

[compatibility]
codec_mailbox = 1
tx_consumption = 1
data_ready = 1
ordered_establish = 1
xid_octets = 3
detect = 1
detect_timeout = 3600
